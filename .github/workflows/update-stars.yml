name: Update Star History Chart

on:
  schedule:
    # Runs every hour – you can change this interval
    - cron: '0 * * * *'
  workflow_dispatch:  # Allows you to run it manually from the Actions tab

jobs:
  update-chart:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download latest star chart
        run: |
          curl -o star-chart.svg "https://api.star-history.com/svg?repos=amerob/ultimate-prompt-engineering-playbook&type=Date"

      - name: Commit and push if changed
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add star-chart.svg
          # Only commit if the file actually changed
          git diff --quiet && git diff --staged --quiet || git commit -m "Update star history chart"
          git push
